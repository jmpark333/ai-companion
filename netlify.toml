[build]
  publish = "."
  command = "node download-tts-models.js"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# Netlify Functions로의 요청은 SPA 리디렉션에서 제외합니다.
[[redirects]]
  from = "/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 리디렉션 규칙은 _redirects 파일에서 관리합니다

[context.production]
  command = "echo 'Production deployment'"

[context.deploy-preview]
  command = "echo 'Preview deployment'"

[context.branch-deploy]
  command = "echo 'Branch deployment'"

# 헤더 설정 for 보안 및 성능
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

# ONNX 모델 파일을 위한 MIME 타입 설정
[[headers]]
  for = "*.onnx"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000"

# JSON 모델 파일을 위한 MIME 타입 설정
[[headers]]
  for = "*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=31536000"

