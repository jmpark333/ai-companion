[build]
  publish = "."
  command = "node download-tts-models.js"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# Netlify Functions로의 요청은 SPA 리디렉션에서 제외합니다.
[[redirects]]
  from = "/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Memory Function 리디렉션
[[redirects]]
  from = "/memory/*"
  to = "/.netlify/functions/memory/:splat"
  status = 200

# Memory Function 기본 경로
[[redirects]]
  from = "/memory"
  to = "/.netlify/functions/memory"
  status = 200

# API 및 Netlify Functions 요청은 SPA 리디렉션에서 제외
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

# 정적 파일들 명시적으로 처리 (리디렉션 방지)
[[redirects]]
  from = "/models/*"
  to = "/models/:splat"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.json"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.onnx"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.png"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.jpg"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.ico"
  to = "/:splat"
  status = 200

# SPA fallback - 위에서 처리하지 않은 요청만 index.html로 리디렉션
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[context.production]
  command = "echo 'Production deployment'"

[context.deploy-preview]
  command = "echo 'Preview deployment'"

[context.branch-deploy]
  command = "echo 'Branch deployment'"

# 헤더 설정 for 보안 및 성능
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=300"

# ONNX 모델 파일을 위한 MIME 타입 설정
[[headers]]
  for = "*.onnx"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000"

# JSON 모델 파일을 위한 MIME 타입 설정
[[headers]]
  for = "*.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=31536000"

